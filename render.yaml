services:
  - type: web
    name: sysm
    runtime: node
    buildCommand: cd client && rm -rf node_modules .vite-temp && npm install --include=dev && ./node_modules/.bin/vite build && cd ../server && rm -rf node_modules && npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    plan: free
